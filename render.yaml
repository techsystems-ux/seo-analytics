# Render Blueprint, free plan: one web service in Singapore (closest region to India). The database is Neon (free,
# does not expire), created separately. Nothing secret is in this file: Render asks for each "sync: false" value
# when the Blueprint is first created. After that, add <Render address>/auth/google/callback as an authorised
# redirect URI on the Google OAuth client, and set OAUTH_REDIRECT_URI to the same address.
#
# Free plan limits: the service sleeps after 15 minutes without visits and takes about a minute to wake. Pulls keep
# it awake while they run. The nightly pull is started by .github/workflows/nightly.yml (Render cron jobs are paid).
services:
  - type: web
    name: hovers-ai-search
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL              # Neon connection string (owner login), ending in ?sslmode=require
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_URI        # https://<your Render address>/auth/google/callback
        sync: false
      - key: TOKEN_KEY                 # same value as on the Mac, so the Google sign-ins copied over keep working
        sync: false
      - key: FLASK_SECRET
        generateValue: true
      - key: CRON_TOKEN                # copy into the GitHub repo secret of the same name, for the nightly pull
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: DB_SET_ROLE               # connect as the owner, then act as the app role so row-level security applies
        value: aeo_app
      - key: ALLOWED_EMAIL_DOMAINS
        value: hovers.in
      - key: SEMRUSH_TOTAL_CAP         # hard lifetime limit on Semrush units, all brands, all pulls (usage is copied from the Mac)
        value: "600"
      - key: SEMRUSH_MAX_UNITS
        value: "200"
      - key: AI_SAMPLES                # answers per prompt per night
        value: "1"
